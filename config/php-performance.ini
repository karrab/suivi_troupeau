; =====================================================================
;  Réglages PHP recommandés pour Suivi Troupeau (production)
;  À copier dans php.ini ou /etc/php/8.x/{fpm,apache2}/conf.d/99-troupeau.ini
; =====================================================================

; ---------- OPcache : bytecode PHP compilé gardé en mémoire ----------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; En production, ne pas vérifier la date des fichiers à chaque requête
; (pensez à vider OPcache après une mise à jour : Paramètres > Système & cache).
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
; JIT (PHP 8+) — utile pour les calculs d'indices
opcache.jit_buffer_size=64M
opcache.jit=tracing
; Préchargement (optionnel, PHP-FPM uniquement) : classes chargées une fois au démarrage
;opcache.preload=/chemin/vers/suivi_troupeau/config/preload.php
;opcache.preload_user=www-data

; ---------- APCu : cache de données en mémoire partagée ----------
extension=apcu
apc.enabled=1
apc.shm_size=64M
apc.ttl=0
apc.entries_hint=4096
apc.enable_cli=0

; ---------- Session ----------
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax

; ---------- Divers ----------
expose_php=Off
memory_limit=256M
max_execution_time=120
date.timezone=Africa/Casablanca
